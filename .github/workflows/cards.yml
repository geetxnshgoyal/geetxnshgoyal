name: profile cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Render the profile, activity and commit-tree cards
        run: python3 scripts/cards.py "${{ github.repository_owner }}" dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the cards to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
